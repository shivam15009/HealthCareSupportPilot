<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Healthcare Support Pilot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--navy:#071a35;--navy-light:#102d50;--gold:#d8b875;--gold-light:#f6e5b7;--gold-dark:#a58043;--teal:#087f8c;--text:#10213b;--muted:#68778b;--border:#dce5ef}
        *{box-sizing:border-box}
        body{min-height:100vh;margin:0;padding:32px 16px;display:flex;align-items:center;justify-content:center;font-family:"DM Sans",sans-serif;background:radial-gradient(circle at 15% 15%,rgba(51,105,145,.28),transparent 32%),radial-gradient(circle at 90% 90%,rgba(8,127,140,.14),transparent 30%),linear-gradient(135deg,#102b4b,#030d20 75%)}
        .login-wrapper{width:100%;max-width:450px}
        .auth-card{position:relative;overflow:hidden;padding:34px 36px 30px;background:linear-gradient(160deg,#fff,#f8fbff);border:1px solid rgba(216,184,117,.8);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.28),0 5px 20px rgba(0,0,0,.08)}
        .top-accent{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--gold-dark),var(--gold-light),#56d5d0,var(--gold))}
        .brand-logo{display:block;width:100%;max-width:340px;height:auto;margin:0 auto 27px;object-fit:contain}
        .eyebrow{margin-bottom:8px;color:var(--gold-dark);text-align:center;text-transform:uppercase;letter-spacing:.2em;font-size:.72rem;font-weight:800}
        .page-title{margin-bottom:8px;color:var(--navy);text-align:center;font-family:"Manrope",sans-serif;font-size:1.8rem;font-weight:800;letter-spacing:-.04em}
        .subtitle{margin-bottom:29px;color:var(--muted);text-align:center;font-size:.96rem}
        .form-label{margin-bottom:8px;color:var(--text);font-size:.9rem;font-weight:700}
        .input-wrap{position:relative}
        .form-control{min-height:51px;padding:13px 15px;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:11px;font-size:.94rem;transition:border-color .2s,box-shadow .2s}
        .form-control::placeholder{color:#9aa8b9}.form-control:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(8,127,140,.10)}
        .password-input{padding-right:68px}
        .toggle-password{position:absolute;top:50%;right:13px;transform:translateY(-50%);padding:5px;color:var(--teal);background:transparent;border:0;font-size:.8rem;font-weight:700;cursor:pointer}.toggle-password:hover{color:var(--navy)}
        .btn-login{width:100%;min-height:52px;margin-top:5px;color:var(--navy);background:linear-gradient(110deg,var(--gold-dark),var(--gold-light) 48%,var(--gold));border:1px solid #c5a15e;border-radius:11px;font-size:.98rem;font-weight:800;box-shadow:0 5px 14px rgba(165,128,67,.15);transition:transform .2s,box-shadow .2s}
        .btn-login:hover{color:var(--navy);background:linear-gradient(110deg,var(--gold),#fff0c7 50%,var(--gold-light));transform:translateY(-1px);box-shadow:0 8px 20px rgba(165,128,67,.23)}.btn-login:disabled{opacity:.7;transform:none}
        .security-note{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:20px;color:#738197;font-size:.76rem}.security-icon{color:var(--teal);font-size:.95rem}
        .footer-text{margin:23px 0 0;color:var(--muted);text-align:center;font-size:.9rem}.footer-text a{color:var(--teal);font-weight:800;text-decoration:none}.footer-text a:hover{color:var(--navy);text-decoration:underline}
        .alert{border-radius:10px;font-size:.88rem}
        @media(max-width:480px){body{padding:16px 12px}.auth-card{padding:29px 23px 25px;border-radius:18px}.brand-logo{max-width:300px;margin-bottom:23px}.page-title{font-size:1.6rem}.subtitle{margin-bottom:25px}}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
    </style>
</head>
<body>
    <main class="login-wrapper">
        <section class="auth-card">
            <div class="top-accent" aria-hidden="true"></div>
            <img class="brand-logo" src="{{ url_for('static', filename='images/login-logo.png') }}" alt="Healthcare Support Pilot logo" onerror="this.style.display='none'">
            <div class="eyebrow">Secure Access</div>
            <h1 class="page-title">Welcome Back</h1>
            <p class="subtitle">Sign in to continue to your support workspace.</p>

            <div id="message" class="alert d-none" role="alert" aria-live="polite"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" class="form-control" type="text" maxlength="80" required autocomplete="username" placeholder="Enter your username">
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrap">
                        <input id="password" class="form-control password-input" type="password" required autocomplete="current-password" placeholder="Enter your password">
                        <button class="toggle-password" id="togglePassword" type="button" aria-controls="password" aria-pressed="false">Show</button>
                    </div>
                </div>
                <button id="loginButton" class="btn btn-login" type="submit">Log In</button>
            </form>

            <div class="security-note"><span class="security-icon" aria-hidden="true">◆</span><span>Secure sign-in powered by JWT authentication</span></div>
            <p class="footer-text">Don't have an account? <a href="/register">Create an Account</a></p>
        </section>
    </main>

    <script>
        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const button = document.getElementById("loginButton");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        function showMessage(text, success = false) {
            message.textContent = text;
            message.className = "alert " + (success ? "alert-success" : "alert-danger");
        }

        togglePassword.addEventListener("click", () => {
            const showing = passwordInput.type === "password";
            passwordInput.type = showing ? "text" : "password";
            togglePassword.textContent = showing ? "Hide" : "Show";
            togglePassword.setAttribute("aria-pressed", String(showing));
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const username = document.getElementById("username").value.trim();
            const password = passwordInput.value;
            message.className = "alert d-none";
            button.disabled = true;
            button.textContent = "Signing In...";

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    showMessage(data.error || data.msg || "Invalid username or password.");
                    return;
                }
                if (!data.access_token) {
                    showMessage("The server did not return an access token.");
                    return;
                }

                // Keep the JWT for API requests that require Bearer authentication.
                localStorage.setItem("access_token", data.access_token);

                // Exchange the JWT for a Flask session used to protect browser pages.
                const sessionResponse = await fetch("/auth/session", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${data.access_token}` }
                });
                if (!sessionResponse.ok) {
                    localStorage.removeItem("access_token");
                    const sessionData = await sessionResponse.json().catch(() => ({}));
                    showMessage(sessionData.error || sessionData.msg || "Login succeeded, but the browser session could not be created. Check that /auth/session is configured in app.py.");
                    return;
                }

                window.location.replace("/dashboard");
            } catch (error) {
                showMessage("Unable to connect to the server. Please try again.");
            } finally {
                button.disabled = false;
                button.textContent = "Log In";
            }
        });
    </script>
</body>
</html>
