<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Healthcare Support Pilot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        :root {
            --navy: #07172f;
            --navy-light: #15365a;
            --gold: #d9b875;
            --gold-light: #f4e2b2;
            --gold-dark: #9d7840;
            --teal: #51d8d5;
            --text: #13243b;
            --muted: #64748b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px 12px;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(
                    ellipse at top,
                    rgba(34, 101, 143, 0.48),
                    transparent 52%
                ),
                linear-gradient(145deg, #12365a, #030b1b 72%);
        }

        .auth-card {
            width: min(460px, 100%);
            padding: 32px;
            background: linear-gradient(180deg, #ffffff, #f7fbff);
            border: 1px solid var(--gold);
            border-radius: 22px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(
                90deg,
                var(--gold-dark),
                var(--gold-light),
                var(--teal),
                var(--gold)
            );
        }

        .brand-logo {
            display: block;
            width: min(270px, 88%);
            max-height: 165px;
            object-fit: contain;
            margin: 0 auto 8px;
        }

        .eyebrow {
            color: var(--gold-dark);
            font-size: 0.72rem;
            letter-spacing: 0.19em;
            text-transform: uppercase;
            font-weight: 800;
            text-align: center;
            margin-bottom: 8px;
        }

        .page-title {
            color: var(--navy);
            font-weight: 800;
        }

        .subtitle {
            color: var(--muted);
        }

        .form-label {
            color: var(--navy);
            font-weight: 650;
        }

        .form-control {
            padding: 12px 14px;
            border: 1px solid #d6e0eb;
            border-radius: 11px;
        }

        .form-control:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 0.22rem rgba(81, 216, 213, 0.22);
        }

        .form-text {
            color: var(--muted);
        }

        .btn-brand {
            width: 100%;
            padding: 12px;
            color: var(--navy);
            font-weight: 800;
            border: 1px solid var(--gold);
            border-radius: 11px;
            background: linear-gradient(
                110deg,
                var(--gold-dark),
                var(--gold-light) 48%,
                var(--gold)
            );
            transition: 0.2s;
        }

        .btn-brand:hover {
            color: var(--navy);
            background: linear-gradient(
                110deg,
                var(--gold),
                #fff0c7 48%,
                var(--gold-light)
            );
            transform: translateY(-1px);
        }

        .btn-brand:disabled {
            opacity: 0.7;
        }

        .auth-footer {
            color: var(--muted);
        }

        a {
            color: #087f8c;
            font-weight: 750;
            text-decoration: none;
        }

        a:hover {
            color: #075d68;
            text-decoration: underline;
        }

        .alert-danger {
            color: #9e2525;
            background: #fff0f0;
            border-color: #ffd0d0;
        }

        .alert-success {
            color: #155e47;
            background: #e8fbf3;
            border-color: #b8efd7;
        }

        @media (max-width: 420px) {
            .auth-card {
                padding: 24px 20px;
            }

            .brand-logo {
                max-height: 135px;
            }
        }
    </style>
</head>

<body>
    <main class="auth-card">

        <img
            class="brand-logo"
            src="{{ url_for('static', filename='images/login-logo.png') }}"
            alt="Healthcare Support Pilot logo"
        >

        <div class="eyebrow">Secure Access</div>

        <h1 class="h4 text-center page-title">
            Create Your Account
        </h1>

        <p class="subtitle text-center mb-4">
            Join Healthcare Support Pilot
        </p>

        <div id="message" class="alert d-none" role="alert"></div>

        <form id="registerForm">

            <div class="mb-3">
                <label for="username" class="form-label">
                    Username
                </label>

                <input
                    id="username"
                    class="form-control"
                    type="text"
                    maxlength="80"
                    autocomplete="username"
                    placeholder="Choose a username"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">
                    Email Address
                </label>

                <input
                    id="email"
                    class="form-control"
                    type="email"
                    maxlength="254"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">
                    Password
                </label>

                <input
                    id="password"
                    class="form-control"
                    type="password"
                    minlength="12"
                    autocomplete="new-password"
                    placeholder="Create a strong password"
                    required
                >

                <div class="form-text">
                    Use at least 12 characters.
                </div>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label">
                    Confirm Password
                </label>

                <input
                    id="confirmPassword"
                    class="form-control"
                    type="password"
                    minlength="12"
                    autocomplete="new-password"
                    placeholder="Enter your password again"
                    required
                >
            </div>

            <button
                id="registerButton"
                class="btn btn-brand"
                type="submit"
            >
                Create Account
            </button>
        </form>

        <p class="auth-footer text-center mt-4 mb-0">
            Already registered?
            <a href="/login">Log In</a>
        </p>
    </main>

    <script>
        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const button = document.getElementById("registerButton");

        function showMessage(text, success = false) {
            message.textContent = text;
            message.className =
                "alert " +
                (success ? "alert-success" : "alert-danger");
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                showMessage("Passwords do not match.");
                return;
            }

            button.disabled = true;
            button.textContent = "Creating Account...";

            try {
                const response = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    showMessage(
                        data.error || "Registration failed."
                    );
                    return;
                }

                showMessage(
                    "Account created successfully. Redirecting to login...",
                    true
                );

                setTimeout(() => {
                    window.location.href = "/login";
                }, 1200);

            } catch (error) {
                showMessage(
                    "Could not connect to the server. Please try again."
                );
            } finally {
                button.disabled = false;
                button.textContent = "Create Account";
            }
        });
    </script>
</body>
</html>
