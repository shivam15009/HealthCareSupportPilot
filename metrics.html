
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SupportPilot Dashboard</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 12px 18px 14px;
    background: #f3f6fa;
    font-family: Arial, Helvetica, sans-serif;
    color: #123e73;
  }

  .dashboard {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
    width: 100%;
  }

  .metric-card {
    min-height: 198px;
    padding: 22px;
    background: #fff;
    border: 1px solid #dce5ef;
    border-radius: 15px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .metric-icon {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e7f4f4;
    color: #008b9b;
    border-radius: 12px;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 16px;
  }

  .metric-label {
    color: #526d91;
    font-size: 12px;
    margin-bottom: 16px;
  }

  .metric-value {
    color: #123e73;
    font-size: 34px;
    line-height: 1.1;
    font-weight: 800;
    letter-spacing: 0.1px;
    margin-bottom: 15px;
    overflow-wrap: anywhere;
  }

  .metric-description {
    color: #526d91;
    font-size: 12px;
    line-height: 1.4;
    margin-top: auto;
  }

  @media (max-width: 1100px) {
    .dashboard { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  @media (max-width: 760px) {
    .dashboard { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .metric-card { padding: 18px; }
    .metric-value { font-size: 28px; }
  }

  @media (max-width: 480px) {
    body { padding: 12px; }
    .dashboard { grid-template-columns: 1fr; gap: 12px; }
    .metric-card { min-height: 175px; }
  }
</style>
</head>
<body>
<main class="dashboard" id="dashboard"></main>

<script>
const metrics = [
  {
    icon: "▦",
    label: "Today's Tickets",
    value: "8",
    description: "Tickets created today"
  },
  {
    icon: "▣",
    label: "AI Resolution Rate",
    value: "93%",
    description: "Tickets marked AI-resolved"
  },
  {
    icon: "◷",
    label: "Average Resolution Time",
    value: "0.45ms",
    description: "Time to resolve a ticket"
  },
  {
    icon: "☻",
    label: "Customer Satisfaction",
    value: "98%",
    description: "Average customer rating"
  },
  {
    icon: "◎",
    label: "Classification Accuracy",
    value: "92%",
    description: "Correctly classified tickets"
  },
  {
    icon: "✓",
    label: "Resolution Success Rate",
    value: "96.9%",
    description: "tickets confirmed resolved"
  },
  {
    icon: "◧",
    label: "Knowledge-Base Coverage",
    value: "94%",
    description: "Tickets with relevant KB information"
  },
  {
    icon: "▤",
    label: "System Uptime",
    value: "99%",
    description: "SupportPilot availability"
  },
  {
    icon: "ϟ",
    label: "Average AI Response Time",
    value: "0.65ms",
    description: "End-to-end AI response duration"
  }
];

const dashboard = document.getElementById("dashboard");

dashboard.innerHTML = metrics.map(metric => `
  <article class="metric-card">
    <div class="metric-icon" aria-hidden="true">${metric.icon}</div>
    <div class="metric-label">${metric.label}</div>
    <div class="metric-value">${metric.value}</div>
    <div class="metric-description">${metric.description}</div>
  </article>
`).join("");
</script>
</body>
</html>
